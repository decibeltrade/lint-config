name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the repo's .nvmrc and engines.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 bundles npm 10.9.x; OIDC trusted publishing needs >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11

      - name: Check npm version
        id: version
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view "$PKG_NAME" version || echo "0.0.0")

          echo "📦 Package: $PKG_NAME"
          echo "📄 Local version: $LOCAL"
          echo "🌐 Published version: $REMOTE"

          if npx semver "$LOCAL" -r ">$REMOTE" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "✅ Version is greater — will publish"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Version not greater — skipping publish"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm install

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test --if-present

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
